# Runs on every pull request and every push to main:
# - lint: the same pre-commit hooks developers run locally, on every file
# - test: a fresh clone + locked install + pytest on Linux, macOS and Windows,

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same branch or PR cancels the run it supersedes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (pre-commit hooks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Run every pre-commit hook on every file
        run: uvx pre-commit run --all-files --show-diff-on-failure

  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Install the locked environment
        run: uv sync --locked
      - name: Check the package imports
        run: uv run python -c "import miax_toolkit; print('OK')"
      - name: Run the tests
        run: uv run pytest

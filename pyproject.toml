[project]
name = "miax-toolkit"
version = "0.1.0"
description = "Toolkit de extraccion, analisis bursatil y gestion de carteras (MIAX Taller B1-T1)"
readme = "README.md"
authors = [
    { name = "Patricia Martin", email = ""},
    { name = "Alvaro Hernandez", email = ""},
    { name = "Lautaro Huljich", email = "lautarohuljich@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fredapi>=0.5.2",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "tiingo>=0.16.1",
    "yfinance>=1.7.0",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff==0.17.2",
]
